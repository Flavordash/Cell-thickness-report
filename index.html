<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>셀 두께 측정 리포트 (Cell Thickness Report)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#eef1f4; --card:#ffffff; --ink:#16232f; --sub:#5c6b7a; --line:#d8dee5;
    --ok:#14953f; --ok-bg:#e3f6ea;
    --ng:#d97706; --ng-bg:#fdf1de;
    --down:#d43a3a; --down-bg:#fcebeb;
    --accent:#0f4c81; --accent-dark:#0b3a63;
    --radius:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Pretendard', -apple-system, sans-serif;
    background:var(--bg); color:var(--ink);
    padding:16px 12px 60px;
    max-width:560px; margin:0 auto;
    font-size:15px;
  }
  header{margin-bottom:18px;}
  header h1{font-size:21px; font-weight:800; letter-spacing:-0.02em;}
  header p{color:var(--sub); font-size:13px; margin-top:4px;}

  .card{
    background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:16px; margin-bottom:14px;
  }
  .card h2{
    font-size:13px; font-weight:700; color:var(--accent);
    letter-spacing:0.04em; margin-bottom:12px;
  }
  label{display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--sub);}
  input[type="datetime-local"], input[type="text"], textarea{
    width:100%; padding:11px 12px; border:1px solid var(--line);
    border-radius:8px; font-family:inherit; font-size:15px; background:#fbfcfd;
  }
  input:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  .time-row{display:flex; gap:8px;}
  .time-row input{flex:1;}
  .btn-now{
    padding:0 14px; border:1px solid var(--accent); color:var(--accent);
    background:#fff; border-radius:8px; font-weight:700; font-size:13px;
    white-space:nowrap; cursor:pointer;
  }

  /* line rows */
  .line-row{
    border-top:1px solid var(--line); padding:12px 0;
  }
  .line-row:first-of-type{border-top:none; padding-top:2px;}
  .line-head{display:flex; align-items:center; gap:10px;}
  .line-name{
    font-weight:800; font-size:15px; min-width:72px;
    font-variant-numeric:tabular-nums;
  }
  .seg{display:flex; flex:1; gap:5px;}
  .seg button{
    flex:1; padding:8px 2px; font-size:12.5px; font-weight:700;
    border:1px solid var(--line); background:#fbfcfd; color:var(--sub);
    border-radius:8px; cursor:pointer; font-family:inherit;
  }
  .seg button.on-ok{background:var(--ok-bg); border-color:var(--ok); color:var(--ok);}
  .seg button.on-ng{background:var(--ng-bg); border-color:var(--ng); color:var(--ng);}
  .seg button.on-down{background:var(--down-bg); border-color:var(--down); color:var(--down);}

  .line-detail{display:flex; gap:8px; margin-top:9px;}
  .ngc{display:flex; align-items:center; gap:6px;}
  .ngc span{font-size:12px; color:var(--sub); font-weight:700;}
  .ngc input{
    width:64px; padding:8px; text-align:center; font-weight:800;
    border:1px solid var(--line); border-radius:8px; font-size:15px;
    font-variant-numeric:tabular-nums; background:#fbfcfd;
  }
  .ngc input.has-ng{border-color:var(--ng); background:var(--ng-bg); color:var(--ng);}
  .note{flex:1;}
  .note input{width:100%; padding:8px 10px; font-size:13.5px;
    border:1px solid var(--line); border-radius:8px; background:#fbfcfd;}
  .hidden{display:none;}

  textarea{min-height:74px; resize:vertical;}

  .submit{
    width:100%; padding:15px; border:none; border-radius:var(--radius);
    background:var(--accent); color:#fff; font-size:16px; font-weight:800;
    font-family:inherit; cursor:pointer; letter-spacing:-0.01em;
  }
  .submit:active{background:var(--accent-dark);}
  .status-msg{
    text-align:center; font-size:13.5px; font-weight:700; margin-top:12px;
    color:var(--ok); min-height:20px;
  }
  .status-msg.err{color:var(--down);}
  footer{text-align:center; color:#a0abb6; font-size:12px; margin-top:24px;}
</style>
</head>
<body>

<header>
  <h1>📊 셀 두께 측정 리포트</h1>
  <p>Cell Thickness Measurement Report — 저장 후 카톡 보고 양식이 자동 복사됩니다</p>
</header>

<div class="card">
  <h2>1. 기본 정보</h2>
  <label for="mtime">측정 시간 *</label>
  <div class="time-row">
    <input type="datetime-local" id="mtime">
    <button type="button" class="btn-now" onclick="setNow()">현재시간</button>
  </div>
  <div style="height:12px"></div>
  <label for="pic">작업자 (PIC) *</label>
  <input type="text" id="pic" placeholder="이름 입력">
</div>

<div class="card">
  <h2>2. 라인별 두께 측정 현황</h2>
  <p style="font-size:12.5px;color:var(--sub);margin-bottom:12px;">
    기본값은 <b style="color:var(--ok)">양호</b>입니다. 미양호/부동 라인만 변경하세요.<br>
    NG 칸에는 두께 NG 수량(숫자)을 입력하세요.
  </p>
  <div id="lines"></div>
</div>

<div class="card">
  <h2>3. 특이사항</h2>
  <textarea id="remark" placeholder="전체 특이사항이 있으면 작성 (선택)"></textarea>
</div>

<button class="submit" onclick="submitReport()">💾 저장 및 리포트 복사 (Save &amp; Copy)</button>
<div class="status-msg" id="msg"></div>

<footer>Made with Claude</footer>

<script>
/* ================= 설정 =================
   구글 Apps Script 웹앱 배포 URL을 여기에 붙여넣으세요.
   비워두면 시트 저장 없이 카톡 양식 복사만 됩니다. */
const SCRIPT_URL = "";
/* ======================================= */

const LINES = ["하프라미1","하프라미2",
  "1-1","1-2","1-3","1-4","1-5","1-6","1-7",
  "2-1","2-2","2-3","2-4","2-5","2-6","2-7",
  "3-1"];
const STATUSES = [
  {key:"양호", cls:"on-ok"},
  {key:"미양호", cls:"on-ng"},
  {key:"라인 부동", cls:"on-down"}
];
const state = {}; // {line: {status, ng, note}}

function buildRows(){
  const wrap = document.getElementById("lines");
  LINES.forEach(name=>{
    state[name] = {status:"양호", ng:0, note:""};
    const row = document.createElement("div");
    row.className = "line-row";
    row.innerHTML = `
      <div class="line-head">
        <div class="line-name">${name}</div>
        <div class="seg">
          ${STATUSES.map((s,i)=>`<button type="button" data-line="${name}" data-s="${s.key}"
            class="${i===0?s.cls:''}">${s.key}</button>`).join("")}
        </div>
      </div>
      <div class="line-detail">
        <div class="ngc"><span>NG</span>
          <input type="number" min="0" inputmode="numeric" value="0" data-ng="${name}">
        </div>
        <div class="note hidden" data-notebox="${name}">
          <input type="text" placeholder="현상 작성 (예: 파형 흔들림)" data-note="${name}">
        </div>
      </div>`;
    wrap.appendChild(row);
  });

  // status buttons
  wrap.querySelectorAll(".seg button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const line = btn.dataset.line, s = btn.dataset.s;
      state[line].status = s;
      const cls = STATUSES.find(x=>x.key===s).cls;
      btn.parentElement.querySelectorAll("button").forEach(b=>b.className="");
      btn.className = cls;
      const box = wrap.querySelector(`[data-notebox="${line}"]`);
      box.classList.toggle("hidden", s==="양호");
    });
  });
  // ng inputs
  wrap.querySelectorAll("[data-ng]").forEach(inp=>{
    inp.addEventListener("input", ()=>{
      const v = Math.max(0, parseInt(inp.value)||0);
      state[inp.dataset.ng].ng = v;
      inp.classList.toggle("has-ng", v>0);
    });
  });
  // notes
  wrap.querySelectorAll("[data-note]").forEach(inp=>{
    inp.addEventListener("input", ()=>{ state[inp.dataset.note].note = inp.value.trim(); });
  });
}

function setNow(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  document.getElementById("mtime").value = d.toISOString().slice(0,16);
}

function fmtTime(v){
  const d = new Date(v);
  const days = ["일","월","화","수","목","금","토"];
  const p = n=>String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}/${p(d.getDate())}(${days[d.getDay()]}) ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function buildReport(mtime, pic, remark){
  const ok=[], ng=[], down=[];
  LINES.forEach(l=>{
    const s = state[l].status;
    if(s==="양호") ok.push(l);
    else if(s==="미양호") ng.push(l);
    else down.push(l);
  });
  const ngLines = LINES.filter(l=>state[l].ng>0);
  const totalNG = LINES.reduce((a,l)=>a+state[l].ng,0);
  const notes = LINES.filter(l=>state[l].note);

  let t = `📊 셀 두께 측정 리포트\n`;
  t += `🕐 측정 시간 : ${fmtTime(mtime)}\n`;
  t += `👤 작업자 : ${pic}\n\n`;
  t += `■ 그래프 현황\n`;
  t += `· 양호 (${ok.length}) : ${ok.length? ok.join(", ") : "없음"}\n`;
  if(ng.length)   t += `· 미양호 (${ng.length}) : ${ng.join(", ")}\n`;
  if(down.length) t += `· 라인 부동 (${down.length}) : ${down.join(", ")}\n`;
  t += `\n■ 두께 NG 현황 (합계 ${totalNG}개)\n`;
  t += ngLines.length ? ngLines.map(l=>`· ${l} : ${state[l].ng}개`).join("\n")+"\n" : `· NG 없음\n`;
  if(notes.length || remark){
    t += `\n■ 현상 / 특이사항\n`;
    notes.forEach(l=> t += `· ${l} : ${state[l].note}\n`);
    if(remark) t += `· ${remark}\n`;
  }
  return t.trim();
}

async function submitReport(){
  const msg = document.getElementById("msg");
  const mtime = document.getElementById("mtime").value;
  const pic = document.getElementById("pic").value.trim();
  const remark = document.getElementById("remark").value.trim();

  if(!mtime){ msg.textContent="⚠️ 측정 시간을 선택하세요"; msg.className="status-msg err"; return; }
  if(!pic){ msg.textContent="⚠️ 작업자 이름을 입력하세요"; msg.className="status-msg err"; return; }

  const report = buildReport(mtime, pic, remark);

  // 1) 클립보드 복사
  try{ await navigator.clipboard.writeText(report); }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = report; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); ta.remove();
  }

  // 2) 구글 시트 저장
  let saved = false;
  if(SCRIPT_URL){
    try{
      await fetch(SCRIPT_URL, {
        method:"POST", mode:"no-cors",
        headers:{"Content-Type":"text/plain"},
        body: JSON.stringify({
          mtime, pic, remark,
          lines: LINES.map(l=>({name:l, ...state[l]}))
        })
      });
      saved = true;
    }catch(e){ console.error(e); }
  }

  msg.className="status-msg";
  msg.textContent = SCRIPT_URL
    ? (saved ? "✅ 저장 완료! 카톡 양식이 복사되었습니다" : "⚠️ 시트 저장 실패 · 복사는 완료됨")
    : "✅ 카톡 양식이 복사되었습니다 (시트 미연결)";
}

buildRows();
setNow();
</script>
</body>
</html>
